site_name: Azure Synapse Dynamic View Guide
site_description: Azure Synapse examples for dynamically removing spaces from table and column names when creating views.
site_url: https://cloud2br-msftlearninghub.github.io/azSynapse-Dynamic-RemoveBlanks/
repo_url: https://github.com/Cloud2BR-MSFTLearningHub/azSynapse-Dynamic-RemoveBlanks
repo_name: Cloud2BR-MSFTLearningHub/azSynapse-Dynamic-RemoveBlanks
docs_dir: docs
site_dir: site
use_directory_urls: true
copyright: Copyright &copy; 2026 <a href="https://github.com/Cloud2BR-MSFTLearningHub" target="_blank" rel="noopener">Cloud2BR OSS - Learning Hub</a>

theme:
  name: material
  logo: https://avatars.githubusercontent.com/u/195347873?v=4
  favicon: https://avatars.githubusercontent.com/u/195347873?v=4
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: blue
    accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - assets/css/custom.css
extra_javascript:
  - assets/js/logo-link.js
  - assets/js/external-links.js
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-MSFTLearningHub
      name: Cloud2BR OSS - Learning Hub

nav:
  - Overview: index.md
  - Serverless SQL Pool: serverless.md
  - Dedicated SQL Pool: dedicated.md